name: pamr_ga

# Versions are those used to produce the published results.
channels:
  - conda-forge

dependencies:
  # ── Core ──────────────────────────────────────────────
  - python=3.10
  - numpy=1.26.4          # must stay <2.0 (RDKit _ARRAY_API crash)
  - rdkit=2022.09.5
  - pandas=2.3.3
  - scipy=1.15.2
  - scikit-learn=1.7.2
  - tqdm=4.70.0

  # ── Example notebook only ─────────────────────────────
  - matplotlib=3.10.9
  - jupyterlab
